[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshbid-core"
version = "0.1.0"
description = "Core contracts for the FreshBid modular MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
freshbid-api = "freshbid.api:run"

[tool.setuptools.packages.find]
where = ["src"]
